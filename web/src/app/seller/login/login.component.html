<div class="auth-box">
  <h1>Seller login</h1>
  <p class="notice" *ngIf="expired">Your session expired, please log in again.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username">
    </label>
    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password">
    </label>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" class="btn" [disabled]="form.invalid || submitting">Log in</button>
  </form>

  <p>New here? <a routerLink="/seller/register">Open a shop</a></p>
</div>
