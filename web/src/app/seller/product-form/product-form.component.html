<a routerLink="/seller" class="back">&larr; Back to your shop</a>
<h1>{{ isEdit ? 'Edit product' : 'New product' }}</h1>

<form [formGroup]="form" (ngSubmit)="save()">
  <label>
    Title
    <input type="text" formControlName="title">
    <span class="invalid" *ngIf="form.get('title').touched && form.get('title').invalid">Title is required</span>
  </label>

  <label>
    Description
    <textarea rows="5" formControlName="description"></textarea>
  </label>

  <label>
    Image URL
    <input type="text" formControlName="imageUrl" placeholder="https://...">
  </label>

  <label>
    Category
    <input type="text" formControlName="category" placeholder="e.g. ceramics">
  </label>

  <div class="row">
    <label>
      Price
      <input type="number" step="0.01" min="0.5" formControlName="price">
      <span class="invalid" *ngIf="form.get('price').touched && form.get('price').invalid">At least $0.50</span>
    </label>
    <label>
      Quantity in stock
      <input type="number" min="0" formControlName="quantity">
    </label>
  </div>

  <ul class="server-errors" *ngIf="serverErrors.length">
    <li *ngFor="let e of serverErrors">{{ e }}</li>
  </ul>

  <button type="submit" class="btn" [disabled]="saving">{{ isEdit ? 'Save changes' : 'List it' }}</button>
</form>
