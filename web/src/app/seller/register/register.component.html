<div class="auth-box">
  <h1>Open a shop</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Shop name
      <input type="text" formControlName="displayName">
    </label>
    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username">
    </label>
    <label>
      Password <small>(8+ characters)</small>
      <input type="password" formControlName="password" autocomplete="new-password">
    </label>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" class="btn" [disabled]="form.invalid || submitting">Create shop</button>
  </form>

  <p>Already selling? <a routerLink="/seller/login">Log in</a></p>
</div>
