<h1>Your cart</h1>

<ng-container *ngIf="cart$ | async as cart; else empty">
  <p *ngIf="cart.items.length === 0">
    Nothing here yet. <a routerLink="/">Go find something nice.</a>
  </p>

  <table class="cart-table" *ngIf="cart.items.length">
    <tr *ngFor="let item of cart.items">
      <td class="thumb"><img [src]="item.imageUrl" [alt]="item.title"></td>
      <td><a [routerLink]="['/products', item.productId]">{{ item.title }}</a></td>
      <td class="qty">
        <button type="button" [disabled]="busy" (click)="changeQuantity(item, item.quantity - 1)">&minus;</button>
        <span>{{ item.quantity }}</span>
        <button type="button" [disabled]="busy" (click)="changeQuantity(item, item.quantity + 1)">+</button>
      </td>
      <td>{{ item.unitPrice | currency }}</td>
      <td class="total">{{ item.lineTotal | currency }}</td>
      <td><button type="button" class="link" [disabled]="busy" (click)="remove(item)">Remove</button></td>
    </tr>
  </table>

  <div class="summary" *ngIf="cart.items.length">
    <p>Subtotal: <strong>{{ cart.subtotal | currency }}</strong></p>
    <a routerLink="/checkout" class="btn">Checkout</a>
  </div>
</ng-container>

<ng-template #empty>
  <p>Nothing here yet. <a routerLink="/">Go find something nice.</a></p>
</ng-template>
