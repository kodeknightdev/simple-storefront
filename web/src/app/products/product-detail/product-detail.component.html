<a routerLink="/" class="back">&larr; Back to shop</a>

<div class="detail" *ngIf="product$ | async as product; else loading">
  <img [src]="product.imageUrl || 'assets/placeholder.svg'" [alt]="product.title">

  <div class="info">
    <h1>{{ product.title }}</h1>
    <p class="seller">Made by <a [routerLink]="['/shop', product.sellerSlug]">{{ product.sellerName }}</a></p>
    <p class="price">{{ product.price | currency }}</p>
    <p class="description">{{ product.description }}</p>
    <p class="stock" *ngIf="product.quantity > 0">{{ product.quantity }} left</p>
    <p class="stock" *ngIf="product.quantity === 0">Sold out - check back later.</p>

    <div class="buy" *ngIf="product.quantity > 0">
      <select [(ngModel)]="quantity" aria-label="Quantity">
        <option *ngFor="let n of range(product.quantity)" [ngValue]="n">{{ n }}</option>
      </select>
      <button type="button" class="btn" [disabled]="adding" (click)="addToCart(product)">Add to cart</button>
    </div>
    <p class="added" *ngIf="added">Added! <a routerLink="/cart">View cart</a></p>
  </div>
</div>

<ng-template #loading>
  <p>Loading...</p>
</ng-template>
