<a class="card" [routerLink]="['/products', product.id]">
  <img [src]="product.imageUrl || placeholder" [alt]="product.title" (error)="onImageError($event)">
  <div class="card-body">
    <h3>{{ product.title }}</h3>
    <p class="seller">by {{ product.sellerName }}</p>
    <p class="price">
      {{ product.price | currency }}
      <span class="sold-out" *ngIf="product.quantity === 0">Sold out</span>
    </p>
  </div>
</a>
